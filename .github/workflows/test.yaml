



name: Test For Mac_Agent

on: 
    push:
        branches:
        - main

jobs:
    build_test:
        name: 项目构建与测试
        runs-on: macos-latest

        steps:
            - name: 拉取代码
              uses: actions/checkout@v4

            - name: 安装python
              uses: actions/setup-python@v4
              with: 
                python-version: '3.10'
                cache: 'pip'
                cache-dependency-path: 'agent_mac/requirements.txt'

            - name: 安装依赖
              run: |
                python3 -m pip install --upgrade pip
                pip3 install -r agent_mac/requirements.txt

            - name: 运行测试
              env:
                PYTHONPATH: ${{ github.workspace }}/agent_mac  # 解决你在 main.py 里 import src 的报错问题
              run: |
                cd agent_mac
                # 使用 perl 模拟 timeout 10秒 动作
                perl -e 'alarm shift; exec @ARGV' 10 python3 main.py